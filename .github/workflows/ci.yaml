name: Java CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'hot-fix-*'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ github.token }}
      - name: Set up JDK 21 (for sonar analysis), 17 & 8 (default)
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            17
            8
          distribution: 'adopt'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Test
        run: ./gradlew clean check jacocoRootReport
      - name: Publish Coverage
        run: |
          # SonarQube Cloud requires the scanner to run on JDK 21+ (JDK 17 is no longer supported).
          export JAVA_HOME="${{env.JAVA_HOME_21_ARM64}}"
          # Keep compiling/testing against the toolchains the build targets, not the scanner JDK.
          echo "org.gradle.java.installations.paths=${JAVA_HOME_8_ARM64},${JAVA_HOME_17_ARM64},${JAVA_HOME_21_ARM64}" >> gradle.properties
          if [ ${{ github.event_name }} == 'pull_request' ]; then
            ./gradlew -Psonar_token=${{ secrets.SONAR_TOKEN }} -Ppullrequest_key=${{ github.event.number }} -Ppullrequest_branch=${{ github.HEAD_REF }} -Ppullrequest_base=${{ github.BASE_REF }} sonar
          else
            ./gradlew -Psonar_token=${{ secrets.SONAR_TOKEN }} -Pbranch_name=${{ github.HEAD_REF }} sonar
          fi